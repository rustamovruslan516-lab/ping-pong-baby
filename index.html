<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌈 Cute Ping Pong 🏓</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #FFB6C1 0%, #C3B1E1 50%, #A8D8EA 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  #gameWrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    display: block;
    width: min(92vw, 800px);
    height: auto;
    aspect-ratio: 8/5;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(100, 50, 150, 0.4),
                0 0 0 8px rgba(255,255,255,0.4),
                0 0 0 12px rgba(255,255,255,0.2);
    background: #1a0033;
  }

  #menu, #winScreen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(26, 0, 51, 0.85);
    border-radius: 30px;
    color: white;
    text-align: center;
    padding: 20px;
    z-index: 10;
    backdrop-filter: blur(8px);
    animation: fadeIn 0.5s;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #menu h1, #winScreen h1 {
    font-size: clamp(26px, 5vw, 46px);
    margin-bottom: 15px;
    background: linear-gradient(90deg, #FFB6C1, #FFD700, #87CEEB, #DDA0DD);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 3s linear infinite;
    background-size: 200% auto;
  }

  @keyframes rainbow { to { background-position: 200% center; } }

  #menu p, #winScreen p {
    font-size: clamp(13px, 2vw, 18px);
    margin: 6px 0;
    opacity: 0.9;
  }

  .bigBtn {
    margin-top: 25px;
    padding: 16px 45px;
    font-size: clamp(17px, 3vw, 22px);
    font-family: inherit;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #FF6B9D, #C44E9F);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 0 #8B2F6B, 0 12px 30px rgba(200, 78, 159, 0.5);
    transition: all 0.15s;
    animation: pulse 1.5s ease-in-out infinite;
  }

  .bigBtn:hover { transform: translateY(-2px); }
  .bigBtn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #8B2F6B, 0 4px 10px rgba(200, 78, 159, 0.4);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .hidden { display: none !important; }

  .muteBtn {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.3);
  color: white;
  font-size: 22px;
  cursor: pointer;
  z-index: 20;
  transition: transform 0.2s;
}
.muteBtn:hover { transform: scale(1.15); }

.logo {
  width: 85%;
  max-width: 320px;
  height: auto;
  margin-bottom: 12px;
  animation: bounceIn 0.8s ease-out, logoFloat 3s ease-in-out infinite 0.8s;
  filter: drop-shadow(0 6px 20px rgba(255, 105, 180, 0.4));
}

@keyframes bounceIn {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  60% { transform: scale(1.15) rotate(10deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.logo {
  width: 85%;
  max-width: 340px;
  height: auto;
  margin-bottom: 15px;
  animation: logoPop 0.9s ease-out, logoFloat 3s ease-in-out 0.9s infinite;
  filter: drop-shadow(0 6px 20px rgba(255, 105, 180, 0.5));
}

@keyframes logoPop {
  0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
  60%  { transform: scale(1.15) rotate(10deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.emojiLogo {
  font-size: 90px;
  margin-bottom: 10px;
  animation: logoFloat 2s ease-in-out infinite;
  filter: drop-shadow(0 6px 15px rgba(255, 105, 180, 0.6));
}
</style>
</head>
<body>
<div id="gameWrap">
    <img src="logo.svg" alt="" style="position:absolute; top:10px; left:10px; width:60px; opacity:0.7; pointer-events:none;">
  <canvas id="game"></canvas>
   <button id="muteBtn" class="muteBtn" title="Ovoz">🔊</button>
  <div id="menu">
    <img src="logo.svg" alt="Ping Pong" class="logo">
    <h1>🌈 Cute Ping Pong 🏓</h1>
    <p>🐭 Sichqoncha yoki barmog'ingiz bilan o'ynang</p>
    <p>⬆️⬇️ Yoki klaviatura: ↑ ↓ / W S</p>
    <p>⭐ 5 ochko — g'alaba!</p>
    <button class="bigBtn" id="startBtn">🎮 Boshlash!</button>
  </div>

  <div id="winScreen" class="hidden">
    <h1 id="winText">🎉 G'alaba! 🎉</h1>
    <p id="winSub">Siz juda zo'rsiz!</p>
    <button class="bigBtn" id="againBtn">🔄 Yana o'ynash</button>
  </div>
</div>
<div class="emojiLogo">🏓</div>

<script>
    
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 800, H = 500;
canvas.width = W;
canvas.height = H;

// 🎵 Ovoz
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, vol=0.08, type='sine') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function playBounce() { playTone(600 + Math.random()*200, 0.08, 0.06, 'triangle'); }
function playScore() {
  playTone(880, 0.15, 0.1, 'sine');
  setTimeout(() => playTone(1100, 0.2, 0.1, 'sine'), 100);
}
function playWin() {
  [523, 659, 784, 1047, 1319].forEach((n, i) =>
    setTimeout(() => playTone(n, 0.3, 0.12, 'sine'), i * 100));
}

// 🎮 Holat
const state = { mode: 'menu', playerScore: 0, aiScore: 0 };

const paddle = { x: 30, y: H/2 - 55, w: 24, h: 110, color: '#FF6B9D', targetY: null };
const ai = { x: W - 54, y: H/2 - 55, w: 24, h: 110, color: '#4ECDC4', speed: 4.2 };
const ball = { x: W/2, y: H/2, r: 14, vx: 6.5, vy: 3, trail: [] };

const particles = [];
const confetti = [];
const messages = [];
const stars = [];
for (let i = 0; i < 60; i++) {
  stars.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 2.5 + 1,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.01
  });
}

// ⌨️ Klaviatura
const keys = { up: false, down: false };
document.addEventListener('keydown', e => {
  if (['ArrowUp','w','W'].includes(e.key)) keys.up = true;
  if (['ArrowDown','s','S'].includes(e.key)) keys.down = true;
});
document.addEventListener('keyup', e => {
  if (['ArrowUp','w','W'].includes(e.key)) keys.up = false;
  if (['ArrowDown','s','S'].includes(e.key)) keys.down = false;
});

// 🖱️ Sichqoncha / 👆 barmoq
function getPointerY(e) {
  const rect = canvas.getBoundingClientRect();
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return (clientY - rect.top) * (H / rect.height);
}
function handlePointer(e) {
  if (state.mode !== 'playing') return;
  e.preventDefault();
  const y = getPointerY(e);
  paddle.targetY = Math.max(0, Math.min(H - paddle.h, y - paddle.h/2));
}
canvas.addEventListener('mousemove', handlePointer);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handlePointer(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); handlePointer(e); }, { passive: false });

// ✨ Effektlar
function spawnParticles(x, y, color, count=15) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 5 + 2;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, decay: 0.02 + Math.random() * 0.02,
      size: Math.random() * 5 + 3, color
    });
  }
}
function spawnConfetti() {
  for (let i = 0; i < 200; i++) {
    confetti.push({
      x: Math.random() * W, y: -30 - Math.random() * 400,
      vx: (Math.random() - 0.5) * 3, vy: Math.random() * 3 + 2,
      size: Math.random() * 10 + 5,
      color: `hsl(${Math.random() * 360}, 85%, 65%)`,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.25
    });
  }
}
function showMessage(text, color='#FFD700') {
  messages.push({ text, x: W/2, y: H/2, color, life: 1.5 });
}

// 🎨 Yordamchi
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function lighten(hex, p) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((num >> 16) & 0xFF) + p * 2.55);
  const g = Math.min(255, ((num >> 8) & 0xFF) + p * 2.55);
  const b = Math.min(255, (num & 0xFF) + p * 2.55);
  return `rgb(${r},${g},${b})`;
}

function resetBall() {
  ball.x = W/2; ball.y = H/2;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const angle = Math.random() * 0.6 - 0.3;
  ball.vx = dir * 6.5;
  ball.vy = Math.sin(angle) * 6.5;
  ball.trail = [];
}

function startGame() {
  ensureAudio();
  state.mode = 'playing';
  state.playerScore = 0;
  state.aiScore = 0;
  paddle.y = H/2 - paddle.h/2;
  paddle.targetY = null;
  ai.y = H/2 - ai.h/2;
  particles.length = 0;
  confetti.length = 0;
  messages.length = 0;
  resetBall();
  startMusic();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('winScreen').classList.add('hidden');
}

function endGame(winner) {
  stopMusic();
    state.mode = 'won';
  if (winner === 'player') {
    playWin();
    spawnConfetti();
    document.getElementById('winText').textContent = '🎉 G\'alaba! 🎉';
    document.getElementById('winSub').textContent =
      `Siz ${state.playerScore} : ${state.aiScore} hisobida yutdingiz! 🏆`;
  } else {
    document.getElementById('winText').textContent = '😊 Yana bir bor!';
    document.getElementById('winSub').textContent =
      `Kompyuter ${state.aiScore} : ${state.playerScore} hisobida yutdi. Qayta urinib ko'ring!`;
  }
  document.getElementById('winScreen').classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

// 🔄 Update
function update() {
  for (const s of stars) s.phase += s.speed;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96; p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx; c.y += c.vy; c.vy += 0.15; c.rot += c.rotSpeed;
    if (c.y > H + 50) confetti.splice(i, 1);
  }
  for (let i = messages.length - 1; i >= 0; i--) {
    const m = messages[i];
    m.y -= 1; m.life -= 0.02;
    if (m.life <= 0) messages.splice(i, 1);
  }

  if (state.mode !== 'playing') return;

  // Raketka
  if (keys.up)   { paddle.y -= 9; paddle.targetY = paddle.y; }
  if (keys.down) { paddle.y += 9; paddle.targetY = paddle.y; }
  if (paddle.targetY !== null) {
    paddle.y += (paddle.targetY - paddle.y) * 0.5;
  }
  paddle.y = Math.max(0, Math.min(H - paddle.h, paddle.y));

  // AI
  const aiC = ai.y + ai.h/2;
  if (Math.abs(ball.y - aiC) > 15) {
    ai.y += Math.sign(ball.y - aiC) * ai.speed;
  }
  ai.y = Math.max(0, Math.min(H - ai.h, ai.y));

  // To'p
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 12) ball.trail.shift();

  // Yuqori/pastki devor
  if (ball.y - ball.r < 0) {
    ball.y = ball.r; ball.vy = Math.abs(ball.vy);
    playBounce(); spawnParticles(ball.x, 0, '#FFD700', 8);
  }
  if (ball.y + ball.r > H) {
    ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy);
    playBounce(); spawnParticles(ball.x, H, '#FFD700', 8);
  }

  // Chap raketka (o'yinchi)
  if (ball.vx < 0 &&
      ball.x - ball.r < paddle.x + paddle.w &&
      ball.x + ball.r > paddle.x &&
      ball.y > paddle.y - ball.r &&
      ball.y < paddle.y + paddle.h + ball.r) {
    ball.x = paddle.x + paddle.w + ball.r;
    const hitPos = (ball.y - (paddle.y + paddle.h/2)) / (paddle.h/2);
    const newSpeed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.04, 13);
    const angle = hitPos * 0.9;
    ball.vx = newSpeed * Math.cos(angle);
    ball.vy = newSpeed * Math.sin(angle);
    playBounce();
    spawnParticles(ball.x, ball.y, '#FF6B9D', 18);
  }

  // O'ng raketka (AI)
  if (ball.vx > 0 &&
      ball.x + ball.r > ai.x &&
      ball.x - ball.r < ai.x + ai.w &&
      ball.y > ai.y - ball.r &&
      ball.y < ai.y + ai.h + ball.r) {
    ball.x = ai.x - ball.r;
    const hitPos = (ball.y - (ai.y + ai.h/2)) / (ai.h/2);
    const newSpeed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.04, 13);
    const angle = hitPos * 0.9;
    ball.vx = -newSpeed * Math.cos(angle);
    ball.vy = newSpeed * Math.sin(angle);
    playBounce();
    spawnParticles(ball.x, ball.y, '#4ECDC4', 18);
  }

  // Gol
  if (ball.x - ball.r < 0) {
    state.aiScore++;
    playScore();
    spawnParticles(0, ball.y, '#FF6B9D', 25);
    if (state.aiScore >= 5) endGame('ai');
    else { resetBall(); showMessage('Yaxshi!', '#4ECDC4'); }
  }
  if (ball.x + ball.r > W) {
    state.playerScore++;
    playScore();
    spawnParticles(W, ball.y, '#4ECDC4', 25);
    if (state.playerScore >= 5) endGame('player');
    else { resetBall(); showMessage('Zo\'r!', '#FFD700'); }
  }
}

// 🎨 Draw
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#2d1b69');
  g.addColorStop(0.5, '#3d2a7a');
  g.addColorStop(1, '#1e1450');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const a = 0.4 + Math.sin(s.phase) * 0.4;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 4;
  ctx.setLineDash([15, 20]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.restore();
}

function drawPaddle(p, faceDir) {
  ctx.save();
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 25;
  const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
  g.addColorStop(0, p.color);
  g.addColorStop(0.5, lighten(p.color, 25));
  g.addColorStop(1, p.color);
  ctx.fillStyle = g;
  roundRect(p.x, p.y, p.w, p.h, p.w/2);
  ctx.fill();
  ctx.restore();

  const cx = p.x + p.w/2;
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cx - 5, p.y + p.h * 0.3, 5, 0, Math.PI * 2);
  ctx.arc(cx + 5, p.y + p.h * 0.3, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#2d1b3d';
  const lx = faceDir === 'right' ? 1.5 : -1.5;
  ctx.beginPath();
  ctx.arc(cx - 5 + lx, p.y + p.h * 0.3, 2.5, 0, Math.PI * 2);
  ctx.arc(cx + 5 + lx, p.y + p.h * 0.3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#2d1b3d';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, p.y + p.h * 0.45, 6, 0.2, Math.PI - 0.2);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,150,180,0.6)';
  ctx.beginPath();
  ctx.arc(cx - 8, p.y + p.h * 0.42, 3, 0, Math.PI * 2);
  ctx.arc(cx + 8, p.y + p.h * 0.42, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawBall() {
  for (let i = 0; i < ball.trail.length; i++) {
    const t = ball.trail[i];
    const a = (i / ball.trail.length) * 0.5;
    const sz = ball.r * (i / ball.trail.length);
    ctx.fillStyle = `rgba(255,182,193,${a})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();
  ctx.shadowColor = '#FF69B4';
  ctx.shadowBlur = 25;
  const g = ctx.createRadialGradient(
    ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, 2,
    ball.x, ball.y, ball.r);
  g.addColorStop(0, '#FFFFFF');
  g.addColorStop(0.5, '#FFB6C1');
  g.addColorStop(1, '#FF69B4');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawConfetti() {
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/4, c.size, c.size/2);
    ctx.restore();
  }
}

function drawMessages() {
  ctx.textAlign = 'center';
  for (const m of messages) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, m.life);
    ctx.font = 'bold 64px "Comic Sans MS", Arial';
    ctx.fillStyle = m.color;
    ctx.shadowColor = m.color;
    ctx.shadowBlur = 25;
    ctx.fillText(m.text, m.x, m.y);
    ctx.restore();
  }
}

function drawScore() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 56px "Comic Sans MS", Arial';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#FF6B9D';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(state.playerScore, W/2 - 120, 60);
  ctx.shadowColor = '#4ECDC4';
  ctx.fillText(state.aiScore, W/2 + 120, 60);

  ctx.font = '22px Arial';
  ctx.shadowBlur = 10;
  for (let i = 0; i < 5; i++) {
    ctx.globalAlpha = i < state.playerScore ? 1 : 0.25;
    ctx.fillText('❤️', W/2 - 220 + i * 26, 60);
  }
  for (let i = 0; i < 5; i++) {
    ctx.globalAlpha = i < state.aiScore ? 1 : 0.25;
    ctx.fillText('💙', W/2 + 20 + i * 26, 60);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// 🎵 Fon musiqasi (yumshoq bolalar ohangi)
let musicOn = true;
let melodyTimer = null;
let melodyIndex = 0;

const melody = [
  523, 659, 784, 880, 784, 659, 523, 0,
  587, 698, 880, 1047, 880, 698, 587, 0,
  523, 659, 784, 880, 880, 784, 659, 523,
  440, 523, 659, 523, 440, 523, 0, 0
];

function playMusicNote() {
  if (!musicOn || !audioCtx || state.mode !== 'playing') return;
  const freq = melody[melodyIndex % melody.length];
  melodyIndex++;
  if (freq === 0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.55);
}

function startMusic() {
  if (melodyTimer) return;
  melodyIndex = 0;
  melodyTimer = setInterval(playMusicNote, 280);
}

function stopMusic() {
  if (melodyTimer) { clearInterval(melodyTimer); melodyTimer = null; }
}

document.getElementById('muteBtn').addEventListener('click', () => {
  musicOn = !musicOn;
  document.getElementById('muteBtn').textContent = musicOn ? '🔊' : '🔇';
});

function draw() {
  drawBackground();
  if (state.mode === 'playing' || state.mode === 'won') {
    drawScore();
    drawPaddle(paddle, 'right');
    drawPaddle(ai, 'left');
    drawBall();
    drawParticles();
    drawMessages();
  }
  drawConfetti();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetBall();
loop();
</script>
</body>
